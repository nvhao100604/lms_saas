services:
  lms-rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: lms-saas-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lms-bff:
    container_name: lms-saas-bff
    build:
      context: ./BFF
      dockerfile: Dockerfile
    ports:
      - "5045:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION_STRING}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=LmsSaaS.BFF
      - Jwt__Audience=LmsSaaS.Client
      - Jwt__ExpiryHours=4.0
      - Jwt__RefreshTokenExpiryDays=7
      - Messaging__UseRabbitMq=true
      - Messaging__RabbitMqHost=lms-rabbitmq
      - Messaging__RabbitMqUser=${RABBITMQ_USER:-guest}
      - Messaging__RabbitMqPassword=${RABBITMQ_PASS:-guest}
    depends_on:
      lms-rabbitmq:
        condition: service_healthy
    restart: unless-stopped
